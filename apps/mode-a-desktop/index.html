<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Campvus</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <span class="eyebrow">Campvus</span>
        <span class="status-dot" id="status-dot" data-status="idle"></span>
      </header>

      <section class="card status-card">
        <h1 id="status-label">Idle</h1>
        <p class="muted" id="status-detail">0 peers connected</p>
      </section>

      <section class="error-banner" id="error-banner" hidden>
        <span id="error-message"></span>
      </section>

      <section class="detail-list">
        <div class="detail-row">
          <span class="muted">Peers connected</span>
          <span class="detail-value" id="peer-count">0</span>
        </div>
        <div class="detail-row">
          <span class="muted">Seeding</span>
          <span class="detail-value" id="seeding-value">Allowed</span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
