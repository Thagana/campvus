# Deploys apps/mode-b-api + apps/mode-b-web as one Fly app (mode-b-api
# serves the built web UI itself — see Dockerfile). Run from the repo root:
#   fly launch --no-deploy   (first time, to claim the app name/org — skip
#                              if you already ran `fly apps create`)
#   fly volumes create campvus_data --size 1 --region <region matching below>
#   fly deploy
#
# IMPORTANT: keep this app at exactly one machine. State lives in SQLite on
# a single Fly volume (apps/mode-b-api/README.md's "one pilot deployment"
# design) — Fly volumes attach to one machine at a time, so scaling beyond
# one machine/instance will not share data and can corrupt the database.
# Don't run `fly scale count N>1` for this app.

app = "campvus-mode-b"       # must be globally unique on Fly — change this
primary_region = "iad"       # change to the region your volume is created in

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"

[[mounts]]
  source = "campvus_data"    # must match the `fly volumes create` name
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
